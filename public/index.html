<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mauro's Toolbox</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      color: #e0e0e0;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }
    /* --- Basketbal cirkels/visuals op de achtergrond --- */
    .basketball-bg {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden;
    }
    .basketball-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      background: radial-gradient(circle at 60% 40%, #3b82f6 60%, #8b5cf6 100%);
      box-shadow: 0 8px 48px 0 #3b82f633;
    }
    .basketball-circle.big {
      width: 420px; height: 420px; left: -120px; top: 60px;
    }
    .basketball-circle.mid {
      width: 220px; height: 220px; right: -80px; top: 180px;
      background: radial-gradient(circle at 40% 60%, #6366f1 60%, #8b5cf6 100%);
    }
    .basketball-circle.small {
      width: 110px; height: 110px; left: 60vw; top: 70vh;
      background: radial-gradient(circle at 60% 40%, #3b82f6 70%, #6366f1 100%);
    }
    .basketball-stripes {
      position: absolute;
      width: 180px; height: 180px; left: 10vw; top: 60vh;
      border-radius: 50%;
      border: 4px solid #8b5cf644;
      border-right: 8px solid #3b82f6aa;
      opacity: 0.08;
      transform: rotate(-18deg);
    }
    .navbar {
      width: 100vw;
      background: #1a1a2e;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-sizing: border-box;
    }
    .navbar-left {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .navbar-right {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
    }
    .navbar-link {
      font-family: 'Poppins', sans-serif;
      font-size: 1.3rem;
      color: #e0e0e0;
      text-decoration: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .navbar-link:hover,
    .navbar-link.active {
      color: #fff;
      background: rgba(59, 130, 246, 0.1);
    }
    .navbar-link.active {
      color: #3b82f6;
      border-bottom: 2px solid #3b82f6;
    }
    .navbar-btn {
      background: transparent;
      color: #e0e0e0;
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      border: 1.5px solid #3b82f6;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .navbar-btn:hover {
      background: #3b82f6;
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    /* Dropdown styles */
    .dropdown {
      position: relative;
      display: none;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background: #1a1a2e;
      border: 1px solid #3b82f6;
      min-width: 200px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border-radius: 8px;
      z-index: 99999;
      top: 110%;
      left: 0;
      padding: 0.5rem 0;
      margin-top: 0.5rem;
    }
    .dropdown:hover .dropdown-content,
    .dropdown:focus-within .dropdown-content {
      display: block;
    }
    .dropdown-link {
      color: #e0e0e0;
      padding: 0.8rem 1.2rem;
      text-decoration: none;
      display: block;
      font-size: 0.95rem;
      border-radius: 0;
      transition: all 0.2s ease;
      font-family: 'Poppins', sans-serif;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .dropdown-link:hover {
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .hero-title {
      font-family: 'Poppins', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      color: #fff;
      text-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
    }
    .hero-subtitle {
      font-size: 1.3rem;
      color: #a0aec0;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 3rem;
      font-family: 'Poppins', sans-serif;
    }
    .dashboard-links {
      display: flex;
      flex-direction: row;
      gap: 2rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 900px;
    }
    .dashboard-btn {
      background: transparent;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      border: 2px solid;
      border-radius: 12px;
      padding: 1.5rem 2.5rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      text-decoration: none;
      letter-spacing: 0.5px;
      display: inline-block;
      flex: 1;
      min-width: 280px;
      max-width: 400px;
    }
    /* NBA Button - Blue theme */
    .dashboard-btn.nba {
      border-color: #3b82f6;
      color: #e0e0e0;
    }
    .dashboard-btn.nba:hover {
      background: #3b82f6;
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(59, 130, 246, 0.4);
    }
    /* CRM Button - Purple theme */
    .dashboard-btn.crm {
      border-color: #8b5cf6;
      color: #e0e0e0;
    }
    .dashboard-btn.crm:hover {
      background: #8b5cf6;
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(139, 92, 246, 0.4);
    }
    @media (max-width: 768px) {
      .hero-title {
        font-size: 2.5rem;
      }
      .hero-subtitle {
        font-size: 1rem;
        margin-bottom: 2rem;
      }
      .dashboard-links {
        flex-direction: column;
        gap: 1.5rem;
        max-width: 100%;
        padding: 0 1rem;
      }
      .dashboard-btn {
        min-width: 200px;
        max-width: 100%;
      }
      .navbar {
        padding: 1rem;
        flex-direction: column;
        gap: 1rem;
      }
      .navbar-left, .navbar-right {
        width: 100%;
        justify-content: center;
      }
    }
    html, body {
      height: 100%;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }
    body {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="basketball-bg">
    <div class="basketball-circle big"></div>
    <div class="basketball-circle mid"></div>
    <div class="basketball-circle small"></div>
    <div class="basketball-stripes"></div>
  </div>
  <nav class="navbar">
    <div class="navbar-left">
      <a href="index.html" class="navbar-link active">Mauro's Toolbox</a>
    </div>
    <div class="navbar-right">
      <!-- Placeholder for future functionality -->
    </div>
  </nav>
  <main class="hero">
    <div class="hero-title">Mauro's Toolbox</div>
    <div class="hero-subtitle">Analytics & Utilities Platform</div>
    <div class="dashboard-links">
      <a href="analytics-dashboard.html" class="dashboard-btn nba">
        NBA Analytics
      </a>
      <a href="crm-menu.html" class="dashboard-btn crm">
        CRM Tools
      </a>
      <div class="dashboard-btn" style="opacity: 0.6; cursor: not-allowed; border-color: #6b7280; color: #9ca3af;">
        SQL Matrix Helper
      </div>
    </div>
  </main>
</body>
</html>
